<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <title>Agentforce (FR)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 800px;
        padding: 80px 20px 48px 20px;
        margin: 0 auto;
      }
      a {
        color: inherit;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <div style="position: absolute; top: 20px; right: 20px;">
        <label for="lang-select" style="font-size: 14px;">Langue :</label>
        <select id="lang-select" onchange="changeLanguage(this.value)">
          <option value="fr" selected>Français</option>
          <option value="en_US">English</option>
        </select>
      </div>

      <p><a href="./">← Accueil</a></p>
      <h1 style="font-size: 20px; margin: 16px 0;">Agentforce (Français)</h1>
      <p>La bulle de chat devrait apparaître en bas à droite.</p>
      <p id="em-status" style="font-size: 12px; color: #555;">Statut : chargement…</p>
    </main>

    <script type="text/javascript">
      function setStatus(msg) {
        var el = document.getElementById("em-status");
        if (el) el.textContent = "Statut : " + msg;
      }

      function changeLanguage(lang) {
        // Refresh page with new language param
        const url = new URL(window.location);
        url.searchParams.set('lang', lang);
        window.location.href = url.href; 
      }

      function initEmbeddedMessaging() {
        // 1. Check URL for lang, but DEFAULT TO 'fr' if empty
        const urlParams = new URLSearchParams(window.location.search);
        const selectedLang = urlParams.get('lang') || "fr"; 

        // 2. Sync dropdown
        const langSelect = document.getElementById("lang-select");
        if (langSelect) langSelect.value = selectedLang;

        try {
          if (typeof embeddedservice_bootstrap === "undefined") {
            setStatus("Script manquant (bootstrap undefined).");
            return;
          }

          // 3. Force clean session
          localStorage.removeItem("embeddedservice_bootstrap_settings");
          
          embeddedservice_bootstrap.settings.language = selectedLang;
          
          embeddedservice_bootstrap.init(
            "00DDT000000Xzto",
            "Airlight_Pro_Agentforce",
            "https://lorealusa--cccai.sandbox.my.site.com/ESWAirlightProAgentforc1759935699067",
            {
              scrt2URL: "https://lorealusa--cccai.sandbox.my.salesforce-scrt.com",
            }
          );
          setStatus("Initialisé en " + selectedLang);
        } catch (err) {
          setStatus("Erreur d'initialisation (voir console).");
          console.error("Error loading Embedded Messaging: ", err);
        }
      }
    </script>
    
    <script
      type="text/javascript"
      src="https://lorealusa--cccai.sandbox.my.site.com/ESWAirlightProAgentforc1759935699067/assets/js/bootstrap.min.js"
      onload="setStatus('Bootstrap chargé, initialisation…'); initEmbeddedMessaging()"
      onerror="setStatus('Erreur chargement bootstrap.min.js')"
    ></script>
  </body>
</html>
