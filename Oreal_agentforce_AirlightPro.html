    <script type="text/javascript">
      function setStatus(msg) {

      }

      function initEmbeddedMessaging() {
        // HARDCODED LANGUAGE SETTING
        const selectedLang = "fr"; 

        try {
          if (typeof embeddedservice_bootstrap === "undefined") {
            setStatus("Le script bootstrap est chargé mais l'objet est indéfini.");

          }

          // 1. CRITICAL: Clear previous session settings to force French to load
          // If we don't do this, it might remember your previous English session.
          localStorage.removeItem("embeddedservice_bootstrap_settings");
          sessionStorage.removeItem("embeddedservice_bootstrap_settings");

          // 2. Apply Language
          embeddedservice_bootstrap.settings.language = selectedLang;

          embeddedservice_bootstrap.init(
            "00DDT000000Xzto",
            "Airlight_Pro_Agentforce",
            "https://lorealusa--cccai.sandbox.my.site.com/ESWAirlightProAgentforc1759935699067",
            {
              scrt2URL: "https://lorealusa--cccai.sandbox.my.salesforce-scrt.com",
            }
          );
          setStatus("Initialisé en : " + selectedLang);
        } catch (err) {
          setStatus("Erreur d'initialisation (voir la console).");
          console.error("Error loading Embedded Messaging: ", err);
        }
      }
    </script>
    <script
